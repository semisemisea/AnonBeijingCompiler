[project]
name = "soyo-arm-bench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "httpx2>=2.10.0",
  "uvicorn>=0.35.0",
  "websockets>=15.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
indent-style = "space"
quote-style = "single"

[tool.pytest.ini_options]
pythonpath = ["."]
